seed: 42
device: auto
data:
  processed_dir: data/processed
  splits_path: data/splits/splits.json
training:
  batch_size: 512
  learning_rate: 0.0001
  epochs: 200
  optimizer: adam
  checkpoint_dir: checkpoints/deep_softmax_autoencoder
  output_dir: outputs/deep_softmax_autoencoder
model:
  input_dim: 500
  latent_dim: 64
  num_classes: 4
  dropout: 0.2
loss:
  # Matches the available TensorFlow source: MSE + 0.1 * cross entropy.
  mode: source_additive
  classification_weight: 0.1
  # Retained for an explicitly selected convex objective.
  gamma: 0.9
